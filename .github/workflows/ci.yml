name: Prototype checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mythseal_test
          POSTGRES_PASSWORD: mythseal_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned deployment tooling
        run: npm ci
      - name: Run deterministic suites
        run: npm test
      - name: Verify private backups on disposable PostgreSQL
        run: bash tools/test-backup-sql.sh
        env:
          TEST_DATABASE_URL: postgres://postgres:mythseal_test_only@127.0.0.1:5432/mythseal_test
      - name: Check local credential storage helper
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Set up pinned local contract toolchain
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Compile and test the local contract toolkit fixture
        run: npm run test:contracts
      - name: Build public asset allowlist
        run: npm run build
      - name: Validate Cloudflare bundles without deploying
        run: |
          npx --no-install wrangler deploy --dry-run
          npx --no-install wrangler deploy --config wrangler.www.jsonc --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Check JavaScript syntax
        run: |
          for module in *.mjs tools/*.mjs server/*.mjs; do
            node --check "$module"
          done
      - name: Check local launcher and server syntax
        run: |
          python3 -m py_compile tools/serve.py
          bash -n Play.command
