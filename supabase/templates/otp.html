<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythseal 登入驗證碼</title></head>
<body style="margin:0;background:#10151c;color:#eee6d6;font-family:Georgia,'Noto Serif TC',serif;padding:32px 16px">
  <div style="max-width:480px;margin:0 auto;border:1px solid #665334;padding:32px;border-radius:16px;background:#171e26">
    <p style="letter-spacing:4px;color:#c9a86a;font-size:12px">MYTHSEAL · 萬象契</p>
    <h1 style="font-size:26px;font-weight:400">一張卡，一段傳說。</h1>
    <p style="line-height:1.8">在遊戲嘅登入畫面輸入以下六位數字，繼續你嘅山海旅程。</p>
    <p style="font-family:monospace;font-size:36px;letter-spacing:8px;color:#eed29a">{{ .Token }}</p>
    <p style="font-size:13px;line-height:1.8;color:#b9b2a5">驗證碼 10 分鐘內有效，請勿轉交他人。<br>如果你冇要求登入，可以忽略呢封電郵。</p>
    <p style="font-size:12px;color:#c9a86a">mythseal.com</p>
  </div>
</body>
</html>
